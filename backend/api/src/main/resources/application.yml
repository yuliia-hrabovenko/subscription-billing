spring:
  application:
    name: api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:subscription_billing}
    username: ${DB_USERNAME:subscription_billing}
    password: ${DB_PASSWORD:subscription_billing}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.apicurio.registry.serde.avro.AvroKafkaSerializer
    properties:
      "[apicurio.registry.url]": ${SCHEMA_REGISTRY_URL:http://localhost:8081/apis/registry/v3}
      # Dev convenience: schemas self-register on first publish. A real environment
      # should pre-register schemas out-of-band and flip this to false so an
      # unregistered/incompatible schema fails loudly instead of silently registering.
      "[apicurio.registry.auto-register]": true

notifications:
  relay:
    poll-interval-ms: ${OUTBOX_RELAY_POLL_INTERVAL_MS:5000}

billing:
  security:
    jwt:
      # Dev-only fallback baked into JwtProperties itself; override via this env var in
      # every real environment (same convention as this file's DB_PASSWORD default).
      secret: ${JWT_SECRET:dev-only-jwt-signing-secret-override-with-JWT_SECRET-env-var-in-every-real-environment}
    admin:
      username: ${ADMIN_USERNAME:admin}
      password-hash: ${ADMIN_PASSWORD_HASH:}
  payments:
    stripe:
      # Dev-only fallback baked into StripeProperties itself; override via this env var
      # in every real environment (same convention as this file's DB_PASSWORD default).
      api-key: ${STRIPE_API_KEY:sk_test_dev_only_override_with_STRIPE_API_KEY_env_var_in_every_real_environment}
      webhook-signing-secret: ${STRIPE_WEBHOOK_SECRET:whsec_dev_only_override_with_STRIPE_WEBHOOK_SECRET_env_var_in_every_real_environment}

app:
  cors:
    # Comma-separated lists. Override allowed-origins for any deployed frontend origin;
    # methods/headers default to what this API actually uses today, but are equally
    # overridable so a future endpoint needing e.g. PATCH is a config change, not a code one.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
    allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,OPTIONS}
    allowed-headers: ${CORS_ALLOWED_HEADERS:Authorization,Content-Type,Idempotency-Key}

management:
  endpoints:
    web:
      exposure:
        # Scraped by the docker-compose Prometheus service (docker/prometheus/prometheus.yml).
        include: prometheus

server:
  port: ${SERVER_PORT:8080}
